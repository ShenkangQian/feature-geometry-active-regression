# Tiny end-to-end exercise of the sweep configuration; not a result.
seeds: [7]
families: [pulse]
methods: [fixed, full, position, linearized, linearized_prior, gp, gp_basis, oracle_z, full_cheap, random, fixed_random, gp_random]
threads: 2
noise_std: 0.035
model: {hidden: 8, position_dim: 2, width_dim: 2}
data:
  train_tasks: 6
  validation_tasks: 2
  test_tasks: 1
  groups:
    pulse: [shift_r0, shift_r3, width_s0.5]
training:
  epochs: 4
  batch_tasks: 1
  contexts: 5
  queries: 5
  lr: 0.008
  inner_steps: 2
  inner_lr: 0.2
  inner_samples: 2
  query_particles: 3
  validate_every: 2
  validation_episodes: 2
  gp_epochs: 6
  calibration_contexts: [4, 7]
  calibration_grid: [1.0, 2.0]
inference: {steps: 4, lr: 0.2, samples: 3, particles: 4}
inference_variants:
  full_cheap: {steps: 2, lr: 0.2, samples: 2, particles: 2}
oracle: {restarts: 2, steps: 30, lr: 0.1}
evaluation:
  pool_points: 25
  integration_points: 16
  test_points: 49
  initial_queries: 3
  additional_queries: 2
  exploration: 0.2
  acquisition: moment
  fantasies: 8
